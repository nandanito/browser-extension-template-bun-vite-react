version: 2
updates:
  # Keep npm/bun dependencies fresh — this template previously drifted
  # several major versions behind; weekly grouped PRs prevent that.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut noise.
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Keep the GitHub Actions used in CI up to date.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
